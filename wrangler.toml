name = "rt-mastery"
main = "worker/index.js"
compatibility_date = "2025-01-01"
account_id = "9848b9c80f6ad73971b96689c0fbee8b"   # "College Projects" Cloudflare account (moved 2026-10-31)

# Static game files are served straight from dist/ at no request cost.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# Non-secret defaults. Secrets go in via: wrangler secret put <NAME>
#   FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY   the Firestore service account
#   INSTRUCTOR_PIN                                gates the dashboard
#   HUB_KEY                                       this app's key for Matt's Admin Hub
#                                                 (the dashboard's Message Project Manager
#                                                 tab); never put it in this file
FIREBASE_PROJECT_ID = "dojomojo-2becb"
