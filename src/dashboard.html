<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RT Mastery — Instructor</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  #app { max-width: 1000px; }
  .who { font-weight: 650; }
  .mini { height: 5px; border-radius: 999px; background: var(--card-hi); overflow: hidden; width: 90px; }
  .mini > i { display: block; height: 100%; background: var(--accent); }
  tr.stale td { opacity: 0.55; }

  /* The topic breakdown. Colour alone never carries it - every chip states the
     score, so this still reads printed in black and white or to a colour-blind
     eye. */
  .tchip { display: inline-block; padding: 3px 9px; margin: 0 5px 5px 0;
           border-radius: 999px; font-size: 0.78rem; background: var(--card-hi); }
  .tchip b { font-variant-numeric: tabular-nums; font-weight: 700; }
  .tchip.good { background: var(--good-soft); color: var(--good); }
  .tchip.mid  { background: var(--accent-soft); color: var(--accent-lit); }
  .tchip.bad  { background: var(--bad-soft); color: var(--bad); }
  tr.detail > td { background: var(--bg-soft); border-top: 0; }
  .acc { height: 6px; border-radius: 999px; background: var(--card-hi);
         overflow: hidden; width: 72px; display: inline-block; vertical-align: middle; }
  .acc > i { display: block; height: 100%; }
  .seen-thin { opacity: 0.6; }
  /* The name is the control that opens the breakdown, so it has to look like
     one without turning the roster into a wall of buttons. */
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: inherit;
             font-weight: 650; cursor: pointer; text-align: left;
             border-bottom: 1px dotted var(--line); }
  .linkbtn:hover { color: var(--accent-lit); border-bottom-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><strong style="font-size:1rem">📊 Instructor dashboard</strong></div>

  <div class="card" id="loginCard">
    <p class="dim" style="font-size:0.9rem">Enter the class code you gave your students and your instructor PIN.</p>
    <div class="field"><label for="code">Class code</label>
      <input id="code" type="text" placeholder="e.g. RT101" autocapitalize="characters"></div>
    <div class="field"><label for="pin">Instructor PIN</label>
      <input id="pin" type="password" placeholder="Your PIN" autocomplete="off"></div>
    <button class="btn" id="go">Load class</button>
    <p class="faint" style="margin-top:10px">The PIN is set with <code>wrangler secret put INSTRUCTOR_PIN</code>. It is checked on the server — students cannot see this data.</p>
  </div>

  <div id="out"></div>
</div>

<script>
(function () {
  'use strict';
  var out = document.getElementById('out');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // One band, used for every topic score on this page, so a chip in a student's
  // row and a bar in the class table never disagree about what "struggling"
  // means. A topic seen once is not evidence either way, so it stays neutral
  // rather than being painted red on a single miss.
  function band(pct, seen) {
    if (seen < 2) return '';
    return pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad';
  }
  function bandColour(pct, seen) {
    var b = band(pct, seen);
    return b === 'good' ? 'var(--good)' : b === 'mid' ? 'var(--accent)'
         : b === 'bad' ? 'var(--bad)' : 'var(--text-faint)';
  }

  // Chips for one student's topics, weakest first. right/seen is shown, not
  // just a percentage: 1/2 and 40/80 are both 50% and mean very different
  // things to someone deciding what to re-teach.
  function topicChips(topics) {
    if (!topics || !topics.length) {
      return '<span class="faint">Nothing recorded yet. Topics appear once they finish a round.</span>';
    }
    return topics.map(function (t) {
      var pct = t.s ? Math.round(100 * t.r / t.s) : 0;
      return '<span class="tchip ' + band(pct, t.s) + (t.s < 2 ? ' seen-thin' : '') + '">' +
        esc(t.t) + ' <b>' + t.r + '/' + t.s + '</b></span>';
    }).join('');
  }

  function ago(iso) {
    if (!iso) return '—';
    var d = Date.now() - new Date(iso).getTime();
    if (isNaN(d)) return '—';
    var h = Math.floor(d / 3600000);
    if (h < 1) return 'just now';
    if (h < 24) return h + 'h ago';
    var days = Math.floor(h / 24);
    return days + 'd ago';
  }

  function load() {
    var code = document.getElementById('code').value.trim();
    var pin = document.getElementById('pin').value;
    if (!code || !pin) return;
    out.innerHTML = '<div class="card dim">Loading…</div>';

    fetch('/api/class?code=' + encodeURIComponent(code) + '&pin=' + encodeURIComponent(pin))
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) {
          out.innerHTML = '<div class="card"><h3>Could not load</h3><p class="dim">' +
            esc(res.j.error || 'Unknown error') + '</p>' +
            (res.j.detail ? '<p class="faint">' + esc(res.j.detail) + '</p>' : '') +
            '</div>';
          return;
        }
        render(res.j);
        try { sessionStorage.setItem('rt-dash', JSON.stringify({ code: code, pin: pin })); } catch (e) {}
      })
      .catch(function () {
        out.innerHTML = '<div class="card"><h3>Network error</h3><p class="dim">Could not reach the server.</p></div>';
      });
  }

  function render(d) {
    var s = d.students || [];
    if (!s.length) {
      out.innerHTML = '<div class="card"><h3>No students yet</h3><p class="dim">Nobody has played with the class code <b>' +
        esc(d.code) + '</b> yet. Students enter it on the welcome screen.</p></div>';
      return;
    }

    // Every student is divided by their OWN denominator. This used to divide
    // the class's mean mastered count by s[0].totalQuestions - and the roster
    // arrives sorted by mastered, so the denominator was whoever happened to be
    // top. A student's totalQuestions is written by the build SHE last opened,
    // and Firestore docs persist, so a class is a mix of old and new totals
    // until all ten reopen the app; the tile moved 8 points when one student
    // answered one question and changed who was first.
    var sumMastered = s.reduce(function (n, x) { return n + (x.mastered || 0); }, 0);
    var sumTotal = s.reduce(function (n, x) { return n + (x.totalQuestions || 0); }, 0);
    var classPct = sumTotal ? Math.round(100 * sumMastered / sumTotal) : 0;
    var active = s.filter(function (x) {
      return x.updatedAt && (Date.now() - new Date(x.updatedAt)) < 7 * 86400000;
    }).length;

    var h = '<div class="statgrid">' +
      '<div class="stat"><div class="n">' + s.length + '</div><div class="l">Students</div></div>' +
      '<div class="stat"><div class="n">' + active + '</div><div class="l">Active this week</div></div>' +
      '<div class="stat"><div class="n">' + classPct + '%</div><div class="l">Class average</div></div>' +
      '</div>';

    if ((d.classWeak || []).length) {
      h += '<div class="card"><h3>What the class is struggling with most</h3>' +
        '<p class="faint" style="margin-top:-4px">Ranked by how many students have it as a weak topic. Worth re-teaching.</p>' +
        '<div class="chiprow">' +
        d.classWeak.map(function (w) {
          var sev = w.students >= Math.max(2, s.length * 0.4) ? 'bad' : '';
          return '<span class="chip ' + sev + '">' + esc(w.topic) + ' &middot; ' + w.students + '</span>';
        }).join('') + '</div></div>';
    }

    // What the class is actually getting right and wrong, from their answers
    // rather than from each phone's own top-six weak list. Weakest first, and
    // the attempt count is shown because a 40% on five attempts across two
    // students is not yet a lesson plan.
    var ct = (d.classTopics || []).filter(function (t) { return t.seen >= 2; });
    if (ct.length) {
      h += '<div class="card"><h3>Every topic, right and wrong</h3>' +
        '<p class="faint" style="margin-top:-4px">The whole class’s answers, weakest first. ' +
        '<b>Correct</b> counts every attempt, so a topic they got wrong twice and right once reads 1/3.</p>' +
        '<div class="tablewrap"><table>' +
        '<tr><th>Topic</th><th>Class accuracy</th><th class="num">Correct</th><th class="num">Students</th></tr>' +
        ct.map(function (t, i) {
          return '<tr' + (i >= 10 ? ' class="moretopic" style="display:none"' : '') + '>' +
            '<td>' + esc(t.topic) + '</td>' +
            '<td><span class="acc"><i style="width:' + t.pct + '%;background:' +
              bandColour(t.pct, t.seen) + '"></i></span> ' +
              '<span class="faint">' + t.pct + '%</span></td>' +
            '<td class="num">' + t.right + '/' + t.seen + '</td>' +
            '<td class="num faint">' + t.students + '</td></tr>';
        }).join('') +
        '</table></div>' +
        (ct.length > 10
          ? '<button class="btn ghost sm" id="moretopics" style="margin-top:10px">Show all ' +
            ct.length + ' topics</button>'
          : '') +
        '</div>';
    }

    h += '<div class="card"><h3>Students</h3>' +
      '<p class="faint" style="margin-top:-4px">Tap a name to see every topic that student has answered, ' +
      'right and wrong.</p><div class="tablewrap"><table>' +
      '<tr><th>Name</th><th class="num">Level</th><th class="num">Mastered</th><th>Progress</th><th class="num">Rounds</th>' +
      '<th class="num">Best exam</th><th class="num">Tokens</th><th>Weakest topics</th><th class="num">Last seen</th><th></th></tr>' +
      s.map(function (x) {
        var pct = x.totalQuestions ? Math.round(100 * (x.mastered || 0) / x.totalQuestions) : 0;
        var stale = !x.updatedAt || (Date.now() - new Date(x.updatedAt)) > 7 * 86400000;
        var best = x.bestExam || 0;
        var sid = slug(x.name);
        var tops = x.topics || [];
        var solid = tops.filter(function (t) { return t.s >= 2 && t.r / t.s >= 0.8; }).length;
        var shaky = tops.filter(function (t) { return t.s >= 2 && t.r / t.s < 0.5; }).length;
        return '<tr class="' + (stale ? 'stale' : '') + '">' +
          '<td class="who"><button class="linkbtn" data-topics="' + esc(sid) + '" ' +
            'title="Show every topic">' + esc(x.name) + '</button></td>' +
          '<td class="num"><b>' + (x.avgLevel || 1) + '</b></td>' +
          '<td class="num">' + (x.mastered || 0) + '/' + (x.totalQuestions || 0) + '</td>' +
          '<td><span class="mini"><i style="width:' + pct + '%"></i></span> <span class="faint">' + pct + '%</span></td>' +
          '<td class="num">' + (x.sessions || 0) + '</td>' +
          '<td class="num">' + (best ? best + '%' : '—') + '</td>' +
          '<td class="num">' + (x.tokens || 0) + ' <button class="iconbtn" data-grant="' + esc(slug(x.name)) + '" ' +
          'data-gname="' + esc(x.name) + '" title="Give tokens">+</button></td>' +
          '<td class="faint">' + esc((x.weakTopics || []).slice(0, 3).join(', ') || '—') + '</td>' +
          '<td class="num faint">' + ago(x.updatedAt) + '</td>' +
          '<td class="num"><button class="iconbtn" data-del="' + esc(sid) + '" ' +
          'data-name="' + esc(x.name) + '" title="Remove this student">&times;</button></td>' +
          '</tr>' +
          // Built now rather than on demand: the data is already here, and a
          // hidden row keeps the toggle a class change instead of a re-render,
          // which would collapse every other open row.
          '<tr class="detail" id="topics-' + esc(sid) + '" style="display:none"><td colspan="10">' +
          '<p class="faint" style="margin:2px 0 8px">' + esc(x.name) + ' &mdash; ' +
          (tops.length
            ? '<b>' + solid + '</b> topic' + (solid === 1 ? '' : 's') + ' solid, <b>' + shaky +
              '</b> struggling, out of ' + tops.length + ' attempted. Weakest first; the number is correct out of attempts.'
            : 'no topics recorded yet.') +
          '</p>' + topicChips(tops) + '</td></tr>';
      }).join('') + '</table></div>' +
      '<p class="faint" style="margin-top:10px">Greyed rows have not played in over a week. ' +
      'Use &times; to remove a duplicate or mistyped name &mdash; this cannot be undone.</p></div>';

    h += '<div class="btn-row" style="margin-top:10px">' +
      '<button class="btn ghost sm" id="refresh">Refresh</button>' +
      '<button class="btn ghost sm" id="grantall">🪙 Give everyone tokens</button>' +
      '</div>';
    out.innerHTML = h;
    document.getElementById('refresh').onclick = load;

    // Toggling a row is a style change, not a re-render: re-rendering here
    // would shut every other row she had already opened.
    Array.prototype.forEach.call(document.querySelectorAll('[data-topics]'), function (b) {
      b.onclick = function () {
        var row = document.getElementById('topics-' + b.getAttribute('data-topics'));
        if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
      };
    });

    var mt = document.getElementById('moretopics');
    if (mt) mt.onclick = function () {
      var hidden = document.querySelectorAll('.moretopic');
      var show = hidden.length && hidden[0].style.display === 'none';
      Array.prototype.forEach.call(hidden, function (r) { r.style.display = show ? '' : 'none'; });
      mt.textContent = show ? 'Show fewer' : 'Show all ' + (hidden.length + 10) + ' topics';
    };

    // Tokens she hands out. One write per student, no reads. The student's own
    // app takes the difference next time it syncs, so a grant cannot be
    // applied twice and is not lost if their phone is off right now.
    function grant(ids, who) {
      var n = prompt('How many tokens for ' + who + '?', '5');
      if (n === null) return;
      n = Math.round(Number(n));
      if (!n || n < 1) return;
      var code = document.getElementById('code').value.trim();
      var pin = document.getElementById('pin').value;
      fetch('/api/grant', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, pin: pin, ids: ids, tokens: n })
      }).then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.ok) {
            alert(n + ' token' + (n === 1 ? '' : 's') + ' to ' + who +
                  '. They will see them the next time they finish a round.');
            load();
          } else alert('Could not give tokens: ' + (j.error || 'unknown error'));
        })
        .catch(function () { alert('Network error.'); });
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-grant]'), function (b) {
      b.onclick = function () {
        grant([b.getAttribute('data-grant')], b.getAttribute('data-gname'));
      };
    });

    var ga = document.getElementById('grantall');
    if (ga) ga.onclick = function () {
      grant(s.map(function (x) { return slug(x.name); }), 'the whole class');
    };

    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.onclick = function () {
        var who = b.getAttribute('data-name');
        if (!confirm('Permanently remove ' + who + ' and all their progress?\n\nThis cannot be undone.')) return;
        b.disabled = true;
        var code = document.getElementById('code').value.trim();
        var pin = document.getElementById('pin').value;
        fetch('/api/class?code=' + encodeURIComponent(code) +
              '&id=' + encodeURIComponent(b.getAttribute('data-del')) +
              '&pin=' + encodeURIComponent(pin), { method: 'DELETE' })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j.ok) load();
            else { alert('Could not remove: ' + (j.error || 'unknown error')); b.disabled = false; }
          })
          .catch(function () { alert('Network error.'); b.disabled = false; });
      };
    });
  }

  // must match the Worker's id derivation
  function slug(s) {
    return String(s || '').toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  }

  document.getElementById('go').onclick = load;
  document.getElementById('pin').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') load();
  });

  // restore the last code/pin for this tab only
  try {
    var prev = JSON.parse(sessionStorage.getItem('rt-dash') || 'null');
    if (prev) {
      document.getElementById('code').value = prev.code || '';
      document.getElementById('pin').value = prev.pin || '';
    }
  } catch (e) {}
})();
</script>
</body>
</html>
