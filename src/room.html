<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Buy Time — Projector</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
<style>
  #app { max-width: 1100px; padding-bottom: 24px; }
  .clock {
    font-variant-numeric: tabular-nums; font-weight: 800;
    font-size: clamp(4rem, 18vw, 11rem); line-height: 1;
    letter-spacing: -0.03em; text-align: center; margin: 4px 0;
  }
  .clock.warn { color: var(--warn); }
  .clock.crit { color: var(--bad); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.55 } }

  .bigbar { height: 22px; border-radius: 999px; background: var(--card-hi); overflow: hidden; }
  .bigbar > i { display: block; height: 100%; background: var(--good); transition: width 0.4s ease; }

  .roomcode {
    font-size: clamp(2.6rem, 9vw, 5rem); font-weight: 800; letter-spacing: 0.22em;
    text-align: center; color: var(--accent); font-family: ui-monospace, monospace;
  }
  .poolchip {
    display: inline-block; font-size: 1.05rem; font-weight: 650;
    padding: 9px 15px; border-radius: 999px; margin: 0 7px 7px 0;
    background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad);
  }
  .player {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card-hi); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px; margin: 0 6px 6px 0; font-size: 0.95rem;
  }
  .player b { color: var(--good); }
  .headline { font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 650; text-align: center; }
  .allhands {
    background: var(--warn); color: #241a00; border-radius: var(--r);
    padding: 18px; text-align: center; font-weight: 800;
    font-size: clamp(1.2rem, 4vw, 2rem); margin-bottom: 12px;
  }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; }
  .ctl .btn { flex: 1 1 130px; }

  /* Field Day: five lanes and nothing else. The absence of any per-student
     number on this screen is the straggler design, not an omission. */
  .lanes { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; }
  .lane { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .lane.lead { border-color: var(--accent); }
  .lane.focus { border-color: var(--bad); }
  .lane-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .lane-name { font-weight: 700; font-size: 1.05rem; flex: 1; }
  .lane-focus { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; color: var(--bad); }
  .lane-at { font-size: 0.95rem; opacity: 0.75; }
  .lane-at b { font-size: 1.15rem; opacity: 1; }
  .lane-track { position: relative; height: 16px; border-radius: 999px; background: var(--card-hi); }
  .lane-track > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.4s ease; }
  .lane.focus .lane-track > i { background: var(--bad); }
  .lane-runner { position: absolute; top: -7px; transform: translateX(-50%); font-size: 1.3rem; transition: left 0.4s ease; }

  /* Beat the Forecast: one dial for the whole room. There is no per-student
     mark on this screen, and none in the document behind it. */
  .dial { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin: 18px 0; text-align: center; }
  .dial.ahead { border-color: var(--good); }
  .dial.behind { border-color: var(--bad); }
  .dial-n { font-size: 4.2rem; font-weight: 800; line-height: 1; }
  .dial.ahead .dial-n { color: var(--good); }
  .dial.behind .dial-n { color: var(--bad); }
  .dial-l { font-size: 0.95rem; opacity: 0.75; margin-top: 6px; }
  .dial-track { position: relative; height: 10px; border-radius: 999px; background: var(--card-hi); margin: 20px 0 6px; }
  .dial-track > i { position: absolute; top: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); transition: left 0.5s ease; }
  .dial.ahead .dial-track > i { background: var(--good); }
  .dial.behind .dial-track > i { background: var(--bad); }
  .dial-mid { position: absolute; left: 50%; top: -4px; width: 2px; height: 18px; background: var(--line); }
  .dial-ends { display: flex; justify-content: space-between; font-size: 0.72rem; opacity: 0.5; }
</style>
</head>
<body>
<div id="app"><div class="card" style="margin-top:32px">Loading…</div></div>
<script src="chapters.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var S = { classCode: '', pin: '', room: null, err: '', poll: null, lastJson: '', game: 'buytime' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function mmss(ms) {
    if (ms < 0) ms = 0;
    var t = Math.ceil(ms / 1000);
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }

  function api(method, path, body) {
    var opt = { method: method, headers: { 'Content-Type': 'application/json' } };
    if (body) opt.body = JSON.stringify(body);
    return fetch(path, opt).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    }).catch(function () { return { ok: false, status: 0, j: { error: 'offline' } }; });
  }

  function control(action, extra) {
    var body = Object.assign({ classCode: S.classCode, pin: S.pin, action: action }, extra || {});
    if (S.room) body.code = S.room.code;
    return api('POST', '/api/room', body).then(function (res) {
      if (!res.ok) { S.err = res.j.error || 'failed'; render(); return; }
      S.err = ''; S.room = res.j.room; S.lastJson = ''; render(); startPolling();
    });
  }

  // Each poll that misses the Worker's 2.5s cache is a billed Firestore read,
  // and the projector is usually the last tab still open. A finished round has
  // nothing left to report, so the loop ends with it.
  function stopPolling() {
    if (S.poll) { clearInterval(S.poll); S.poll = null; }
  }
  // Three room states, forever. A format that invents a fourth terminal word is
  // invisible to every already-delivered bundle, and a projector that never
  // recognises the end polls Firestore every four seconds until the tab closes.
  function over(r) { return !!r && (r.state === 'ended' || r.state === 'won'); }

  function poll() {
    if (!S.room || over(S.room)) { stopPolling(); return; }
    api('GET', '/api/room?classCode=' + encodeURIComponent(S.classCode) + '&code=' + S.room.code)
      .then(function (res) {
        if (res.status === 404 || res.status === 410) { stopPolling(); return; }
        if (!res.ok) return;

        // An unchanged room means an unchanged screen. render() replaces the whole
        // body, so rebuilding every tick can pull a control button out from under
        // the instructor's finger. The ALL HANDS banner closes on the clock rather
        // than in the document, so its state rides in the signature - one render
        // when it opens, one when it shuts.
        var rm = res.j.room;
        var gdef = defOf(rm);
        var j = JSON.stringify(rm) + (gdef && gdef.sig ? gdef.sig(rm) : '');
        S.room = rm;
        if (j !== S.lastJson) { S.lastJson = j; render(); }
        if (over(S.room)) stopPolling();
      });
  }
  function startPolling() {
    stopPolling();
    if (over(S.room)) return;
    S.poll = setInterval(poll, 4000);
    if (!window._tick) window._tick = setInterval(paintClock, 250);
  }

  // The clock is derived from the absolute deadline, so it never drifts and a
  // dropped poll does not freeze it.
  function paintClock() {
    var el = document.getElementById('clock');
    if (!S.room) return;
    var gdef = defOf(S.room);
    var ends = gdef && gdef.clockMs ? gdef.clockMs(S.room) : null;
    if (!el || !ends) return;
    var left = ends - Date.now();
    el.textContent = mmss(left);
    el.className = 'clock' + (left < 30000 ? ' crit' : left < 60000 ? ' warn' : '');
  }

  // Each format is one entry. The projector never names a game outside this
  // object - it asks the registry for a label, a settings form and three views.
  var GAMES = {
    buytime: {
      label: 'Buy Time',
      icon: '⏱️',
      blurb: 'One clock the whole class keeps alive. Every correct answer buys the room seconds; nothing anyone gets wrong ever costs it any.',
      // the create-time settings this format needs
      settings: function () {
        return '<div class="btn-row">' +
          '<div class="field" style="flex:1;margin:0"><label for="target">Questions to clear</label>' +
          '<input id="target" type="number" value="40" min="5" max="200"></div>' +
          '<div class="field" style="flex:1;margin:0"><label for="mins">Starting clock (min)</label>' +
          '<input id="mins" type="number" value="5" min="1" max="60"></div>' +
          '</div>';
      },
      // read back into the create payload
      config: function () {
        return {
          target: Number(document.getElementById('target').value) || 40,
          minutes: Number(document.getElementById('mins').value) || 5
        };
      },
      // this format has a shared countdown; one with no clock omits these two
      clockMs: function (r) { return (r.gs || r).endsAtMs || null; },
      autoEnd: function (r) {
        var g = r.gs || r;
        return !!(g.endsAtMs && g.endsAtMs < Date.now() - 1500);
      },
      // anything that closes on the wall clock rather than on a document change
      // has to say so, or the render that closes it never happens
      sig: function (r) {
        var a = (r.gs || r).allHands;
        return a && !a.solved && new Date(a.endsAt).getTime() > Date.now() ? '|ah' : '';
      },
      controls: function () {
        return [
          { id: 'allhands', action: 'allhands' },
          { id: 'extend', action: 'extend', extra: { seconds: 60 } }
        ];
      },
      lobby: viewLobby,
      running: viewRunning,
      over: viewOver
    },

    fieldday: {
      label: 'Field Day',
      icon: '\uD83C\uDFC1',
      blurb: 'Five lanes, one per chapter. Every right answer moves the lane its question came from. Nobody races anybody, so there is no order of students to come last in.',
      settings: function () {
        return '<div class="btn-row">' +
          '<div class="field" style="flex:1;margin:0"><label for="laps">Steps to win a lane</label>' +
          '<input id="laps" type="number" value="20" min="5" max="80"></div>' +
          '<div class="field" style="flex:1;margin:0"><label for="fdmins">Clock (min)</label>' +
          '<input id="fdmins" type="number" value="10" min="1" max="60"></div>' +
          '</div>';
      },
      config: function () {
        return {
          laps: Number(document.getElementById('laps').value) || 20,
          minutes: Number(document.getElementById('fdmins').value) || 10
        };
      },
      clockMs: function (r) { return (r.gs || {}).endsAtMs || null; },
      autoEnd: function (r) {
        var g = r.gs || {};
        return !!(g.endsAtMs && g.endsAtMs < Date.now() - 1500);
      },
      controls: function () {
        return [
          { id: 'focus', action: 'focus' },
          { id: 'extend', action: 'extend', extra: { seconds: 60 } }
        ];
      },
      lobby: fdLobby,
      running: fdRunning,
      over: fdOver
    },

    forecast: {
      label: 'Beat the Forecast',
      icon: '\uD83D\uDCC8',
      blurb: 'The app quietly tells each student what it expects of them, from their own history. This wall shows only whether the room as a whole beat its own prediction - never a single student\u2019s number.',
      settings: function () {
        return '<div class="btn-row">' +
          '<div class="field" style="flex:1;margin:0"><label for="holes">Questions each</label>' +
          '<input id="holes" type="number" value="10" min="3" max="30"></div>' +
          '<div class="field" style="flex:1;margin:0"><label for="bfmins">Clock (min)</label>' +
          '<input id="bfmins" type="number" value="12" min="1" max="60"></div>' +
          '</div>';
      },
      config: function () {
        return {
          holes: Number(document.getElementById('holes').value) || 10,
          minutes: Number(document.getElementById('bfmins').value) || 12
        };
      },
      clockMs: function (r) { return (r.gs || {}).endsAtMs || null; },
      autoEnd: function (r) {
        var g = r.gs || {};
        return !!(g.endsAtMs && g.endsAtMs < Date.now() - 1500);
      },
      controls: function () {
        return [{ id: 'extend', action: 'extend', extra: { seconds: 60 } }];
      },
      lobby: bfLobby,
      running: bfRunning,
      over: bfOver
    }
  };

  // --------------------------------------------------- Beat the Forecast
  //
  // One number for the whole room. There is deliberately nothing per student
  // on this screen, and nothing per student in the document behind it, so
  // there is nothing here to leak.

  function bfLobby() {
    var r = S.room, g = r.gs || {};
    return '<div class="topbar"><strong>Beat the Forecast</strong><div class="spacer"></div>' +
      '<span class="pill">' + r.players.length + ' joined</span></div>' +
      '<div class="card pad-lg center"><p class="dim" style="margin:0 0 4px">Room code</p>' +
      '<div class="roomcode">' + esc(r.code) + '</div>' +
      '<p class="dim">' + g.holes + ' questions each. Everyone gets a different set, ' +
      'and a private number to beat.</p></div>' +
      '<div class="card"><h3>In the room</h3>' +
      (r.players.length
        ? '<div>' + r.players.map(function (p) { return '<span class="player">' + esc(p.name) + '</span>'; }).join('') + '</div>'
        : '<p class="dim">Nobody yet. Read the room code out.</p>') +
      '</div>' +
      '<button class="btn" id="start"' + (r.players.length ? '' : ' disabled') + '>Start the clock</button>';
  }

  function bfDial(g) {
    var m = g.margin || 0;
    // the needle is the room margin, mapped onto a span of plus or minus five
    var pct = Math.max(0, Math.min(100, 50 + (m / 5) * 50));
    var cls = m > 0.05 ? 'ahead' : m < -0.05 ? 'behind' : 'level';
    return '<div class="dial ' + cls + '">' +
      '<div class="dial-n">' + (m > 0 ? '+' : '') + m.toFixed(1) + '</div>' +
      '<div class="dial-l">' + (m > 0.05
        ? 'questions BETTER than the room was expected to do'
        : m < -0.05 ? 'questions short of what the room was expected to do'
        : 'exactly where the room was expected to be') + '</div>' +
      '<div class="dial-track"><span class="dial-mid"></span>' +
      '<i style="left:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="dial-ends"><span>behind</span><span>the forecast</span><span>ahead</span></div>' +
      '</div>';
  }

  function bfRunning() {
    var r = S.room, g = r.gs || {};
    return '<div class="clock" id="clock">--:--</div>' +
      bfDial(g) +
      '<div class="card center"><p class="dim" style="margin:0">' +
      '<b>' + (g.answered || 0) + '</b> answered across the room</p>' +
      '<p class="faint" style="margin:6px 0 0">Everybody is on different questions, ' +
      'against their own number. Nobody here is compared to anybody.</p></div>' +
      '<div class="ctl">' +
      '<button class="btn ghost sm" id="extend">+60 seconds</button>' +
      '<button class="btn ghost sm" id="end">End round</button>' +
      '</div>';
  }

  function bfOver() {
    var r = S.room, g = r.gs || {};
    var m = g.margin || 0;
    return '<div class="center" style="margin-top:18px">' +
      '<div style="font-size:3.2rem">' + (m > 0.05 ? '\uD83D\uDCC8' : '\uD83D\uDCCA') + '</div>' +
      '<h1>' + (m > 0.05 ? 'The room beat its forecast' :
                m < -0.05 ? 'The room came up short' : 'Exactly as predicted') + '</h1>' +
      '</div>' + bfDial(g) +
      '<div class="card center"><p class="faint" style="margin:0">' +
      (g.answered || 0) + ' answers. Every student\u2019s own margin is on their own phone ' +
      'and was never sent here.</p></div>' +
      '<button class="btn" id="again">New round</button>';
  }

  // --------------------------------------------------------------- Field Day

  var CHAPTERS = window.RT_CHAPTERS || [];

  function laneName(id) {
    var c = CHAPTERS.filter(function (x) { return x.id === id; })[0];
    return c ? 'Ch ' + c.number + ' \u00b7 ' + c.title : id;
  }

  function fdLobby() {
    var r = S.room, g = r.gs || {};
    return '<div class="topbar"><strong>Field Day</strong><div class="spacer"></div>' +
      '<span class="pill">' + r.players.length + ' joined</span></div>' +
      '<div class="card pad-lg center"><p class="dim" style="margin:0 0 4px">Room code</p>' +
      '<div class="roomcode">' + esc(r.code) + '</div>' +
      '<p class="dim">First lane to <b>' + g.laps + '</b> steps wins. ' +
      'Clock <b>' + (g.startMinutes || 10) + ':00</b>.</p></div>' +
      '<div class="card"><h3>In the room</h3>' +
      (r.players.length
        ? '<div>' + r.players.map(function (p) { return '<span class="player">' + esc(p.name) + '</span>'; }).join('') + '</div>'
        : '<p class="dim">Nobody yet. Read the room code out.</p>') +
      '</div>' +
      '<button class="btn" id="start"' + (r.players.length ? '' : ' disabled') + '>Start the clock</button>';
  }

  // The five lanes and NOTHING else. No name with a number beside it, ever -
  // that absence is the whole straggler design, not an oversight.
  function fdLanes(g, over) {
    var laps = g.laps || 20;
    var lanes = g.lanes || {};
    // a finished round has no live focus to advertise
    var focus = over ? null : g.focus;
    var ids = CHAPTERS.length ? CHAPTERS.map(function (c) { return c.id; }) : Object.keys(lanes);
    var lead = ids.reduce(function (m, id) { return (lanes[id] || 0) > (lanes[m] || 0) ? id : m; }, ids[0]);

    return ids.map(function (id) {
      var at = lanes[id] || 0;
      var pct = Math.min(100, 100 * at / laps);
      var isFocus = focus && focus.chapter === id;
      return '<div class="lane' + (id === lead && at > 0 ? ' lead' : '') + (isFocus ? ' focus' : '') + '">' +
        '<div class="lane-top"><span class="lane-name">' + esc(laneName(id)) + '</span>' +
        (isFocus ? '<span class="lane-focus">DOUBLE &middot; ' + focus.left + ' left</span>' : '') +
        '<span class="lane-at"><b>' + at + '</b>/' + laps + '</span></div>' +
        '<div class="lane-track"><i style="width:' + pct.toFixed(1) + '%"></i>' +
        '<span class="lane-runner" style="left:' + pct.toFixed(1) + '%">\uD83C\uDFC3</span></div>' +
        '</div>';
    }).join('');
  }

  function fdRunning() {
    var r = S.room, g = r.gs || {};
    var h = '';
    if (g.focus) {
      h += '<div class="allhands">\uD83C\uDFAF FOCUS &mdash; ' + esc(laneName(g.focus.chapter)) +
        '<div style="font-size:0.9rem;font-weight:600;margin-top:4px">what the room is getting wrong most ' +
        '&middot; worth double steps for the next ' + g.focus.left + '</div></div>';
    }
    h += '<div class="clock" id="clock">--:--</div>';
    h += '<div class="lanes">' + fdLanes(g) + '</div>';
    h += '<div class="ctl">' +
      '<button class="btn ghost sm" id="focus">\uD83C\uDFAF Focus the weakest</button>' +
      '<button class="btn ghost sm" id="extend">+60 seconds</button>' +
      '<button class="btn ghost sm" id="end">End round</button>' +
      '</div>';
    return h;
  }

  function fdOver() {
    var r = S.room, g = r.gs || {};
    var lanes = g.lanes || {};
    var ids = CHAPTERS.length ? CHAPTERS.map(function (c) { return c.id; }) : Object.keys(lanes);
    var won = g.winner;
    var lead = won || ids.reduce(function (m, id) { return (lanes[id] || 0) > (lanes[m] || 0) ? id : m; }, ids[0]);
    var misses = g.misses || {};
    var worst = Object.keys(misses).sort(function (a, b) { return misses[b] - misses[a]; }).slice(0, 3);

    return '<div class="center" style="margin-top:18px">' +
      '<div style="font-size:3.2rem">\uD83C\uDFC1</div>' +
      '<h1>' + esc(laneName(lead)) + '</h1>' +
      '<p class="dim">' + (won ? 'crossed the line first' : 'finished furthest ahead') + '</p></div>' +
      '<div class="lanes">' + fdLanes(g, true) + '</div>' +
      (worst.length
        ? '<div class="card"><h3 style="margin-bottom:4px">Teach these next</h3>' +
          '<p class="faint" style="margin:0 0 10px">Where the room got it wrong most. No names, ever.</p>' +
          '<div>' + worst.map(function (id) {
            return '<span class="poolchip">' + esc(laneName(id)) + ' &middot; ' + misses[id] + '</span>';
          }).join('') + '</div></div>'
        : '') +
      '<button class="btn" id="again">New round</button>';
  }

  function gameOf(r) { return (r && r.game) || 'buytime'; }
  function defOf(r) { return r ? (GAMES[gameOf(r)] || null) : null; }

  function viewSetup() {
    var ids = Object.keys(GAMES);
    var pick = GAMES[S.game] ? S.game : ids[0];
    var def = GAMES[pick];
    return '<div style="height:28px"></div>' +
      '<div class="center"><div style="font-size:2.6rem">' + def.icon + '</div>' +
      '<h1>' + esc(def.label) + '</h1><p class="dim">Projector view</p></div>' +
      (S.err ? '<div class="banner warn">' + esc(S.err) + '</div>' : '') +
      '<div class="card pad-lg">' +
      '<div class="field"><label for="cc">Class code</label>' +
      '<input id="cc" placeholder="e.g. RT101" autocapitalize="characters" value="' + esc(S.classCode) + '"></div>' +
      '<div class="field"><label for="pin">Instructor PIN</label>' +
      '<input id="pin" type="password" autocomplete="off" value="' + esc(S.pin) + '"></div>' +
      // The picker. This is the ONLY place a game is chosen, and the choice
      // leaves here inside the room code - she reads out four letters and says
      // nothing else.
      (ids.length > 1
        ? '<div class="field"><label for="game">Game</label><select id="game">' +
          ids.map(function (id) {
            return '<option value="' + id + '"' + (id === pick ? ' selected' : '') + '>' +
                   esc(GAMES[id].label) + '</option>';
          }).join('') + '</select></div>'
        : '') +
      def.settings() +
      '<div class="spacer-sm"></div>' +
      '<button class="btn" id="create">Create a room</button>' +
      '<p class="faint" style="margin-top:12px">' + esc(def.blurb) + '</p>' +
      '<p class="faint">Students open the game and tap <b>Join live round</b>, then type the code. ' +
      'They never pick anything.</p>' +
      '</div>';
  }

  function viewLobby() {
    var r = S.room, g = r.gs || r;
    return '<div class="topbar"><strong>' + esc(defOf(r).label) + '</strong><div class="spacer"></div>' +
      '<span class="pill">' + r.players.length + ' joined</span></div>' +
      '<div class="card pad-lg center"><p class="dim" style="margin:0 0 4px">Room code</p>' +
      '<div class="roomcode">' + esc(r.code) + '</div>' +
      '<p class="dim">Clear <b>' + g.target + '</b> questions before the clock runs out. ' +
      'Starting clock <b>' + (g.startMinutes || 5) + ':00</b>.</p></div>' +
      '<div class="card"><h3>In the room</h3>' +
      (r.players.length
        ? '<div>' + r.players.map(function (p) { return '<span class="player">' + esc(p.name) + '</span>'; }).join('') + '</div>'
        : '<p class="dim">Nobody yet. Read the room code out.</p>') +
      '</div>' +
      '<button class="btn" id="start"' + (r.players.length ? '' : ' disabled') + '>Start the clock</button>';
  }

  function viewRunning() {
    var r = S.room, g = r.gs || r;
    var pct = Math.min(100, 100 * (g.cleared || 0) / (g.target || 1));
    var h = '';

    if (g.allHands && !g.allHands.solved && new Date(g.allHands.endsAt).getTime() > Date.now()) {
      h += '<div class="allhands">&#9995; ALL HANDS &mdash; ' + esc(g.allHands.topic) +
        '<div style="font-size:0.9rem;font-weight:600;margin-top:4px">on every phone now &middot; any correct answer buys 60 seconds</div></div>';
    }

    h += '<div class="clock" id="clock">--:--</div>' +
      '<div class="headline" style="margin-bottom:10px">' +
      '<b>' + (g.cleared || 0) + '</b> of <b>' + g.target + '</b> cleared</div>' +
      '<div class="bigbar" style="margin-bottom:16px"><i style="width:' + pct.toFixed(1) + '%"></i></div>';

    h += '<div class="card"><h3 style="margin-bottom:4px">Open pool &mdash; nobody could clear these</h3>' +
      '<p class="faint" style="margin:0 0 10px">Anyone can take one. Worth double. No names, ever.</p>' +
      (g.pool.length
        ? '<div>' + g.pool.map(function (p) { return '<span class="poolchip">' + esc(p.topic) + '</span>'; }).join('') + '</div>'
        : '<p class="dim" style="margin:0">Empty. The room is clearing everything.</p>') +
      '</div>';

    h += '<div class="card"><h3>Contributing</h3><div>' +
      r.players.map(function (p) {
        return '<span class="player">' + esc(p.name) + ' <b>' + ((g.scores || {})[p.id] || 0) + '</b></span>';
      }).join('') +
      '</div><p class="faint" style="margin:10px 0 0">Nobody may clear more than ' +
      g.perStudentCap + ' &mdash; it takes most of the room to finish.</p></div>';

    h += '<div class="ctl">' +
      '<button class="btn ghost sm" id="allhands"' + (g.pool.length ? '' : ' disabled') + '>&#9995; All hands</button>' +
      '<button class="btn ghost sm" id="extend">+60 seconds</button>' +
      '<button class="btn ghost sm" id="end">End round</button>' +
      '</div>';
    return h;
  }

  function viewOver() {
    var r = S.room, g = r.gs || r;
    // Victory is a fact the game records, not a room state.
    var won = g.won === true || r.state === 'won' || (g.cleared || 0) >= g.target;
    return '<div class="center" style="margin-top:18px">' +
      '<div style="font-size:3.2rem">' + (won ? '&#127881;' : '&#9203;') + '</div>' +
      '<h1>' + (won ? 'The room made it' : 'Clock ran out') + '</h1>' +
      '<p class="dim">' + (g.cleared || 0) + ' of ' + g.target + ' cleared</p></div>' +
      '<div class="card"><h3>Teach these next</h3>' +
      '<p class="faint" style="margin:0 0 10px">What nobody in the room could clear. This is the lesson plan.</p>' +
      (g.pool.length
        ? '<div>' + g.pool.map(function (p) { return '<span class="poolchip">' + esc(p.topic) + '</span>'; }).join('') + '</div>'
        : '<p class="dim" style="margin:0">Nothing survived the pool. They know it.</p>') +
      '</div>' +
      '<div class="card"><h3>Everyone contributed</h3><div>' +
      r.players.map(function (p) { return '<span class="player">' + esc(p.name) + ' <b>' + ((g.scores || {})[p.id] || 0) + '</b></span>'; }).join('') +
      '</div></div>' +
      '<button class="btn" id="again">New round</button>';
  }

  function render() {
    var r = S.room;
    if (!r) { app.innerHTML = viewSetup(); bind(); paintClock(); return; }
    var def = defOf(r);
    if (!def) {
      // A room naming a game this projector does not have. Say so plainly -
      // never fall back to another game's board, which would look correct.
      app.innerHTML = '<div class="center" style="margin-top:40px">' +
        '<div style="font-size:3rem">↻</div><h1>Update this page</h1>' +
        '<p class="dim">This room is running <b>' + esc(gameOf(r)) + '</b>, which this ' +
        'projector page does not know yet. Reload, then create the room again.</p></div>' +
        '<button class="btn" id="again">Back to setup</button>';
      bind(); return;
    }
    app.innerHTML = r.state === 'lobby' ? def.lobby()
                  : r.state === 'running' ? def.running()
                  : def.over();
    bind();
    paintClock();
  }

  function bind() {
    // Picking a game re-renders the setup form, because each format asks for
    // different settings.
    var sel = document.getElementById('game');
    if (sel) sel.onchange = function () { S.game = sel.value; render(); };

    var c = document.getElementById('create');
    if (c) c.onclick = function () {
      S.classCode = document.getElementById('cc').value.trim();
      S.pin = document.getElementById('pin').value;
      if (!S.classCode || !S.pin) { S.err = 'Class code and PIN are both needed.'; render(); return; }
      try { sessionStorage.setItem('rt-room', JSON.stringify({ c: S.classCode, p: S.pin, g: S.game })); } catch (e) {}
      var def = GAMES[S.game] || GAMES.buytime;
      // the game id rides with the create; from here on the room carries it
      control('create', Object.assign({ game: S.game }, def.config()));
    };

    var s = document.getElementById('start'); if (s) s.onclick = function () { control('start'); };
    var x = document.getElementById('end');   if (x) x.onclick = function () { control('end'); };
    var g = document.getElementById('again'); if (g) g.onclick = function () { S.room = null; S.lastJson = ''; render(); };

    // Per-game controls. Each format declares its own, so two formats can both
    // have a button without one silently firing the other's verb.
    var def = defOf(S.room);
    if (def && def.controls) {
      def.controls().forEach(function (ctl) {
        var el = document.getElementById(ctl.id);
        if (el) el.onclick = function () { control(ctl.action, ctl.extra || {}); };
      });
    }
  }

  try {
    var prev = JSON.parse(sessionStorage.getItem('rt-room') || 'null');
    if (prev) { S.classCode = prev.c || ''; S.pin = prev.p || ''; S.game = prev.g || 'buytime'; }
  } catch (e) {}

  // If the clock runs out, close the round so the projector stops counting down.
  // The in-flight flag matters: a slow cold start would otherwise fire end again
  // every two seconds while the first one is still travelling.
  var ending = false;
  setInterval(function () {
    if (ending) return;
    var gdef = defOf(S.room);
    if (S.room && S.room.state === 'running' && gdef && gdef.autoEnd && gdef.autoEnd(S.room)) {
      ending = true;
      control('end').then(function () { ending = false; });
    }
  }, 2000);

  render();
})();
</script>
</body>
</html>
